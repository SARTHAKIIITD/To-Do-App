<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
  <div class="outer-container flex">
    <div class="inner-container">
      <form id="signup-form" class="flex">
        <h1>Sign Up</h1>
        <p>create an account or <span>sign in</span></p>
        <label for="#email">Email address</label>
        <input id="email" class="text-input" type="text">
        <label for="#username">Username</label>
        <input id="username" class="text-input" type="text">
        <label for="#password">Password</label>
        <input id="password" class="text-input" type="password">
        <span><input id="advertisements" type="checkbox">
        <label for="advertisements">I do not want to receive emails with advertising, news, suggestions or marketing promotions</span></label>  
        <button id="sign-up-btn" type="button">Sign up</button>
      </form>
      <p>By signing up to create an account, you are accepting our terms of service and privacy policy</p>
    </div>
  </div>
  <script src="../Js/signup.js"></script>
</body>
</html>
