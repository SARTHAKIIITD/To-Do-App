<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../CSS/dashboard.css">
</head>
<body>
  <div class="flex outer-container">
    <div class="flex side-bar">
      <div class="flex btn-container">
        <button id="dash-btn">Dashboard</button>
        <button id="todo-btn">todos</button>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
    <div class="flex inner-container">

      <section id="dashboard" class="page active-page">
        <h1>Welcome <span id="user-name"></span></h1>
      </section>

      <section id="todo-list" class="page">
        <div class="add-item-container">
          <input id="task-input" type="text" placeholder="Enter new task">
          <button id="add-btn">add</button>
        </div>
        
        <div class="flex list-display"></div>
        <div class="clear-all-btn-container">
          <button id="clear-all-btn">clear all</button>
        </div>
      </div>
    </section>
  </div>
  <script src="../Js/dashboard.js"></script>
</body>
</html>
